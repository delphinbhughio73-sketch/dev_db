<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delphin Bhughio Thomas | Accueil</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">Delphin<span>.</span></div>

      <!-- Bouton Hamburger -->
      <button class="menu-toggle" id="mobile-menu" aria-label="Ouvrir le menu">
        <i class="fa-solid fa-bars"></i>
      </button>

      <!-- Menu de navigation -->
      <ul class="nav-links" id="nav-list">
        <li><a href="index.html" class="active">Accueil</a></li>
        <li><a href="apropos.html">À propos</a></li>
        <li><a href="developpement.html">Développement</a></li>
        <li><a href="photographie.html">Photographie</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <h1>Delphin Bhughio Thomas</h1>
        <p class="subtitle">Développeur d'Applications Web & Photographe Portraitiste</p>
        <div class="btn-group">
          <a href="developpement.html" class="btn btn-primary">Voir mes Réalisations</a>
          <a href="contact.html" class="btn btn-secondary">Me Contacter</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Delphin Bhughio Thomas. Tous droits réservés.</p>
  </footer>

  <!-- Script JS pour activer le menu mobile -->
  <script>
    const menuToggle = document.getElementById('mobile-menu');
    const navList = document.getElementById('nav-list');
    const menuIcon = menuToggle.querySelector('i');

    menuToggle.addEventListener('click', () => {
      navList.classList.toggle('active');
      
      if (navList.classList.contains('active')) {
        menuIcon.classList.remove('fa-bars');
        menuIcon.classList.add('fa-xmark');
      } else {
        menuIcon.classList.remove('fa-xmark');
        menuIcon.classList.add('fa-bars');
      }
    });
  </script>

</body>
</html>
