<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delphin Bhughio Thomas | Contact</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <!-- ========================================== -->
  <!-- EN-TÊTE AVEC LE BOUTON HAMBURGER           -->
  <!-- ========================================== -->
  <header>
    <nav class="navbar">
      <div class="logo">Delphin<span>.</span></div>

      <!-- Bouton Hamburger (Visible sur mobile) -->
      <button class="menu-toggle" id="mobile-menu" aria-label="Ouvrir le menu">
        <i class="fa-solid fa-bars"></i>
      </button>

      <!-- Menu de navigation -->
      <ul class="nav-links" id="nav-list">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="apropos.html">À propos</a></li>
        <li><a href="developpement.html">Développement</a></li>
        <li><a href="photographie.html">Photographie</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- ========================================== -->
  <!-- CONTENU PRINCIPAL (FORMULAIRE)             -->
  <!-- ========================================== -->
  <main>
    <div class="page-header">
      <h1>Parlons de votre Projet</h1>
      <p>N'hésitez pas à me contacter pour un projet web ou une session photo.</p>
    </div>

    <!-- Formulaire configuré pour envoyer l'e-mail directement vers votre boîte Gmail -->
    <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
      
      <!-- Votre Access Key Web3Forms -->
      <input type="hidden" name="apikey" value="865176e1-5ffb-4224-9c09-8e2e715b9ead">

      <div class="form-group">
        <label for="name">Nom complet</label>
        <input type="text" id="name" name="name" placeholder="Votre nom" required />
      </div>
      
      <div class="form-group">
        <label for="email">Adresse email</label>
        <input type="email" id="email" name="email" placeholder="votre.email@exemple.com" required />
      </div>
      
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Décrivez votre besoin..." required></textarea>
      </div>

      <!-- Redirection après l'envoi -->
      <input type="hidden" name="redirect" value="https://web3forms.com/success">

      <button type="submit" class="btn btn-primary">Envoyer</button>
    </form>
  </main>

  <!-- ========================================== -->
  <!-- PIED DE PAGE                               -->
  <!-- ========================================== -->
  <footer>
    <p>&copy; 2026 Delphin Bhughio Thomas. Tous droits réservés.</p>
  </footer>

  <!-- ========================================== -->
  <!-- SCRIPT JAVASCRIPT POUR LE MENU HAMBURGER   -->
  <!-- ========================================== -->
  <script>
    const menuToggle = document.getElementById('mobile-menu');
    const navList = document.getElementById('nav-list');
    const menuIcon = menuToggle.querySelector('i');

    menuToggle.addEventListener('click', () => {
      navList.classList.toggle('active');
      
      // Alterne l'icône entre les barres et la croix
      if (navList.classList.contains('active')) {
        menuIcon.classList.remove('fa-bars');
        menuIcon.classList.add('fa-xmark');
      } else {
        menuIcon.classList.remove('fa-xmark');
        menuIcon.classList.add('fa-bars');
      }
    });
  </script>

</body>
</html>
